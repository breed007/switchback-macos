name: Switchback
options:
  bundleIdPrefix: com.breed007
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "YA83Q8FTH3"   # Brian Reed — Developer ID signing/notarization

targets:
  Switchback:
    type: application
    platform: macOS
    sources:
      - path: Switchback
      - path: Shared
      # The helper's launchd plist, where SMAppService.daemon(plistName:) looks for it.
      - path: Helper/com.breed007.switchback.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      # The helper binary ships at Contents/MacOS/SwitchbackHelper.
      - target: SwitchbackHelper
        embed: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: Switchback
        PRODUCT_BUNDLE_IDENTIFIER: com.breed007.switchback
        INFOPLIST_FILE: Switchback/Info.plist
        ENABLE_HARDENED_RUNTIME: YES     # required for notarization
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # NOTE: Switchback is intentionally NOT sandboxed — the privileged
    # SCPreferences commit (location switch) cannot run inside the App Sandbox.
    # Distribution is GitHub + Homebrew, not the Mac App Store.

  # Privileged helper: a root LaunchDaemon registered through SMAppService. It can
  # only switch to an existing location. See docs/v0.5-spec.md (F1).
  SwitchbackHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper/main.swift
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: SwitchbackHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.breed007.switchback.helper
        INFOPLIST_FILE: Helper/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES   # gives the tool a signing identifier
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
